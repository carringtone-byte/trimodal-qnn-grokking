seed: 9202
output_dir: trimodal_qnn_codex/outputs/phase1_ordered_route_mod97_dirac_mean_stable3_from_3000_no_same_sum

data:
  modulus: 97
  train_fraction: 0.30
  split_seed: 0
  problem_mode: ordered_route
  train_routes: ["TT", "TN", "TI", "NT", "NN", "NI", "IT", "IN", "II"]
  eval_routes: ["TT", "TN", "TI", "NT", "NN", "NI", "IT", "IN", "II"]

model:
  problem_mode: ordered_route
  n_qubits: 7
  n_layers: 4
  feature_dim: 64
  operand_feature_dim: 32
  text_embed_dim: 32
  image_channels: 12
  amplitude_mode: fixed_equal
  ordered_initialization: active_route
  cross_mixing: true
  entangle_content: true
  head_type: layerwise_dirac_mean
  fourier_max_frequency: 21
  dirac_kernel_init: fejer
  dirac_kernel_trainable: true
  dirac_coefficient_mode: none
  dirac_coefficient_eps: 1.0e-6

training:
  steps: 40000
  batch_size: 256
  lr: 0.00005
  weight_decay: 0.0001
  eval_every: 1000
  checkpoint_every: 1000
  same_sum_loss_weight: 0.0
  amplitude_balance_weight: 0.0
  fourier_auxiliary_weight: 0.0
  fourier_auxiliary_min_frequency: 1
  fourier_auxiliary_max_frequency: 21
  fourier_auxiliary_normalize_pairs: true
  fourier_auxiliary_frequency_power: 0.25
  layerwise_dirac_loss_weight: 0.10
  layerwise_dirac_depth_weighted: true
  hard_neighbor_margin_weight: 0.0
  hard_neighbor_margin: 1.0
  hard_neighbor_offsets: [1, 2]
  hard_neighbor_focus_gamma: 0.0
  max_grad_norm: 0.10
  parameter_clip_abs: 10.0
  sector_mixer_clip_abs: 0.50
  head_scale_log_min: -4.0
  head_scale_log_max: 1.0
  stop_on_nonfinite: true
  resume_checkpoint: trimodal_qnn_codex/outputs/phase1_ordered_route_mod97_dirac_mean_stable3_from_3000_no_same_sum/checkpoint_20000.pt
  resume_optimizer: true
  device: auto

notes:
  goal: Continue the successful ordered-route layerwise Dirac-delta mean no-same-sum run to 40000 total steps.
  parent_run: trimodal_qnn_codex/outputs/phase1_ordered_route_mod97_dirac_mean_stable3_from_3000_no_same_sum
  parent_checkpoint: checkpoint_20000.pt
  continuation: Same objective and optimizer state as the clean 3000-to-20000 continuation.

seed: 9203
output_dir: modular_addition_mech_interp/trimodal_qnn_codex/outputs/phase1_ordered_route_mod97_dirac_hybrid_superposition_same_sum_curriculum_5k

data:
  modulus: 97
  train_fraction: 0.30
  split_seed: 0
  problem_mode: ordered_route
  train_routes: ["TT", "TN", "TI", "NT", "NN", "NI", "IT", "IN", "II"]
  eval_routes: ["TT", "TN", "TI", "NT", "NN", "NI", "IT", "IN", "II"]

model:
  problem_mode: ordered_route
  n_qubits: 7
  n_layers: 4
  feature_dim: 64
  operand_feature_dim: 32
  text_embed_dim: 32
  image_channels: 12
  amplitude_mode: fixed_equal
  ordered_initialization: all_route_superposition
  cross_mixing: true
  route_mixer_type: hybrid_factorized_dense
  route_interaction_rank: 2
  route_interaction_scale: 0.02
  route_dense_residual_scale: 0.05
  entangle_content: true
  head_type: layerwise_dirac_mean
  fourier_max_frequency: 21
  dirac_kernel_init: fejer
  dirac_kernel_trainable: true
  dirac_coefficient_mode: none
  dirac_coefficient_eps: 1.0e-6

training:
  steps: 5000
  batch_size: 256
  lr: 0.00005
  weight_decay: 0.0001
  eval_every: 500
  checkpoint_every: 1000
  same_sum_loss_weight: 0.02
  same_sum_loss_start_step: 2500
  same_sum_loss_warmup_steps: 1500
  same_sum_loss_kind: representation_mse
  same_sum_target: features
  same_sum_stop_gradient: true
  same_sum_normalize: true
  amplitude_balance_weight: 0.0
  fourier_auxiliary_weight: 0.0
  fourier_auxiliary_min_frequency: 1
  fourier_auxiliary_max_frequency: 21
  fourier_auxiliary_normalize_pairs: true
  fourier_auxiliary_frequency_power: 0.25
  layerwise_dirac_loss_weight: 0.10
  layerwise_dirac_depth_weighted: true
  hard_neighbor_margin_weight: 0.0
  hard_neighbor_margin: 1.0
  hard_neighbor_offsets: [1, 2]
  hard_neighbor_focus_gamma: 0.0
  max_grad_norm: 0.10
  parameter_clip_abs: 10.0
  sector_mixer_clip_abs: 0.50
  head_scale_log_min: -4.0
  head_scale_log_max: 1.0
  stop_on_nonfinite: true
  resume_checkpoint: null
  resume_optimizer: true
  device: auto

notes:
  goal: 5k test of suggestions 1 and 2 after the factorized/superposition run under-generalized.
  changes:
    - Hybrid route mixer equals factorized left/right route dynamics plus a small dense Hermitian residual.
    - Same-sum representation MSE is off for early arithmetic fitting, then linearly ramps from step 2500 to 3999.
  comparison: Same seed and data split as the factorized/superposition/representation-loss 40k run.

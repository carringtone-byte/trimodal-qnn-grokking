training:
  steps: 20000
  batch_size: 256
  lr: 0.00005
  weight_decay: 0.0001
  eval_every: 1000
  checkpoint_every: 1000
  same_sum_loss_weight: 0.0
  amplitude_balance_weight: 0.0
  fourier_auxiliary_weight: 0.0
  fourier_auxiliary_min_frequency: 1
  fourier_auxiliary_max_frequency: 21
  fourier_auxiliary_normalize_pairs: true
  fourier_auxiliary_frequency_power: 0.25
  layerwise_dirac_loss_weight: 0.10
  layerwise_dirac_depth_weighted: true
  hard_neighbor_margin_weight: 0.0
  hard_neighbor_margin: 1.0
  hard_neighbor_offsets: [1, 2]
  hard_neighbor_focus_gamma: 0.0
  max_grad_norm: 0.10
  parameter_clip_abs: 10.0
  sector_mixer_clip_abs: 0.50
  head_scale_log_min: -4.0
  head_scale_log_max: 1.0
  stop_on_nonfinite: true
  resume_checkpoint: trimodal_qnn_codex/outputs/phase1_ordered_route_mod97_dirac_mean_stable_from_2000/checkpoint_3000.pt
  resume_optimizer: false
  device: auto


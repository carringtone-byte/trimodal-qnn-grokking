seed: 9301
output_dir: trimodal_qnn_codex/outputs/phase1_three_sector_mod97_dirac_mean

data:
  modulus: 97
  train_fraction: 0.30
  split_seed: 0
  problem_mode: three_sector
  train_routes: null
  eval_routes: null

model:
  problem_mode: three_sector
  n_qubits: 7
  n_layers: 4
  feature_dim: 64
  operand_feature_dim: 32
  text_embed_dim: 32
  image_channels: 12
  amplitude_mode: fixed_equal
  ordered_initialization: active_route
  cross_mixing: true
  entangle_content: true
  head_type: layerwise_dirac_mean
  fourier_max_frequency: 21
  dirac_kernel_init: fejer
  dirac_kernel_trainable: true
  dirac_coefficient_mode: none
  dirac_coefficient_eps: 1.0e-6

training:
  steps: 30000
  batch_size: 256
  lr: 0.0004
  weight_decay: 0.0001
  eval_every: 1000
  checkpoint_every: 1000
  same_sum_loss_weight: 0.001
  amplitude_balance_weight: 0.0
  fourier_auxiliary_weight: 0.0
  fourier_auxiliary_min_frequency: 1
  fourier_auxiliary_max_frequency: 21
  fourier_auxiliary_normalize_pairs: true
  fourier_auxiliary_frequency_power: 0.25
  layerwise_dirac_loss_weight: 0.50
  layerwise_dirac_depth_weighted: true
  hard_neighbor_margin_weight: 0.10
  hard_neighbor_margin: 2.0
  hard_neighbor_offsets: [1, 2]
  hard_neighbor_focus_gamma: 0.50
  max_grad_norm: 0.5
  parameter_clip_abs: 20.0
  sector_mixer_clip_abs: 1.0
  head_scale_log_min: -4.0
  head_scale_log_max: 2.0
  stop_on_nonfinite: true
  resume_checkpoint: null
  resume_optimizer: true
  device: auto

notes:
  goal: End-to-end trimodal three-sector QNN with layerwise Dirac-delta mean readout.
  comparison: Direct follow-up to phase1_three_sector_mod97_lessons_v2 and the unimodal layerwise_dirac_mean runs.

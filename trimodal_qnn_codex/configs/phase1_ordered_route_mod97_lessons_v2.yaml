seed: 9202
output_dir: trimodal_qnn_codex/outputs/phase1_ordered_route_mod97_lessons_v2

data:
  modulus: 97
  train_fraction: 0.30
  split_seed: 0
  problem_mode: ordered_route
  train_routes: ["TT", "TN", "TI", "NT", "NN", "NI", "IT", "IN", "II"]
  eval_routes: ["TT", "TN", "TI", "NT", "NN", "NI", "IT", "IN", "II"]

model:
  problem_mode: ordered_route
  n_qubits: 7
  n_layers: 4
  feature_dim: 64
  operand_feature_dim: 32
  text_embed_dim: 32
  image_channels: 12
  amplitude_mode: fixed_equal
  ordered_initialization: active_route
  cross_mixing: true
  entangle_content: true
  fourier_max_frequency: 21
  fourier_residual: true

training:
  steps: 30000
  batch_size: 256
  lr: 0.0005
  weight_decay: 0.0001
  eval_every: 1000
  checkpoint_every: 1000
  same_sum_loss_weight: 0.001
  amplitude_balance_weight: 0.0
  fourier_auxiliary_weight: 0.10
  fourier_auxiliary_min_frequency: 1
  fourier_auxiliary_max_frequency: 21
  fourier_auxiliary_normalize_pairs: true
  fourier_auxiliary_frequency_power: 0.25
  hard_neighbor_margin_weight: 0.05
  hard_neighbor_margin: 1.5
  hard_neighbor_offsets: [1, 2]
  hard_neighbor_focus_gamma: 0.25
  max_grad_norm: 0.5
  parameter_clip_abs: 20.0
  sector_mixer_clip_abs: 1.0
  head_scale_log_min: -4.0
  head_scale_log_max: 2.5
  stop_on_nonfinite: true
  resume_checkpoint: null
  resume_optimizer: true
  device: auto

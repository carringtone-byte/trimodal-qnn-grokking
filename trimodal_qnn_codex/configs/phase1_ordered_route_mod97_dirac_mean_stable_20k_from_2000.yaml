seed: 9202
output_dir: trimodal_qnn_codex/outputs/phase1_ordered_route_mod97_dirac_mean_stable_from_2000

data:
  modulus: 97
  train_fraction: 0.30
  split_seed: 0
  problem_mode: ordered_route
  train_routes: ["TT", "TN", "TI", "NT", "NN", "NI", "IT", "IN", "II"]
  eval_routes: ["TT", "TN", "TI", "NT", "NN", "NI", "IT", "IN", "II"]

model:
  problem_mode: ordered_route
  n_qubits: 7
  n_layers: 4
  feature_dim: 64
  operand_feature_dim: 32
  text_embed_dim: 32
  image_channels: 12
  amplitude_mode: fixed_equal
  ordered_initialization: active_route
  cross_mixing: true
  entangle_content: true
  head_type: layerwise_dirac_mean
  fourier_max_frequency: 21
  dirac_kernel_init: fejer
  dirac_kernel_trainable: true
  dirac_coefficient_mode: none
  dirac_coefficient_eps: 1.0e-6

training:
  steps: 20000
  batch_size: 256
  lr: 0.0001
  weight_decay: 0.0001
  eval_every: 1000
  checkpoint_every: 1000
  same_sum_loss_weight: 0.0005
  amplitude_balance_weight: 0.0
  fourier_auxiliary_weight: 0.0
  fourier_auxiliary_min_frequency: 1
  fourier_auxiliary_max_frequency: 21
  fourier_auxiliary_normalize_pairs: true
  fourier_auxiliary_frequency_power: 0.25
  layerwise_dirac_loss_weight: 0.25
  layerwise_dirac_depth_weighted: true
  hard_neighbor_margin_weight: 0.03
  hard_neighbor_margin: 1.0
  hard_neighbor_offsets: [1, 2]
  hard_neighbor_focus_gamma: 0.25
  max_grad_norm: 0.25
  parameter_clip_abs: 15.0
  sector_mixer_clip_abs: 0.75
  head_scale_log_min: -4.0
  head_scale_log_max: 1.5
  stop_on_nonfinite: true
  resume_checkpoint: trimodal_qnn_codex/outputs/phase1_ordered_route_mod97_dirac_mean_2000/checkpoint_2000.pt
  resume_optimizer: false
  device: auto

notes:
  goal: Stabilized 20000-step continuation of the ordered-route layerwise Dirac-delta mean variant.
  parent_run: trimodal_qnn_codex/outputs/phase1_ordered_route_mod97_dirac_mean_2000
  parent_checkpoint: checkpoint_2000.pt
  failed_aggressive_resume: trimodal_qnn_codex/outputs/phase1_ordered_route_mod97_dirac_mean_2000/checkpoint_nonfinite_2610.pt
  stabilization: Fresh optimizer, lower LR, weaker auxiliary losses, and tighter parameter/head clipping.

[project]
name = "trimodal-qnn-grokking"
version = "0.1.0"
description = "Selected Tri-Modal and QNN modular-grokking experiments and mechanistic analyses."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
